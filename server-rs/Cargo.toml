[package]
name = "revklik-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Web / async runtime
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "request-id", "util", "fs"] }
hyper = "1"
# DB
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "json", "uuid", "migrate", "ipnetwork"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Crypto / hashing
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"
# HTTP client (LLM, Polar, marketplaces, GSC, CF Email)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# GeoIP
maxminddb = "0.24"
# Config / logging
figment = { version = "0.10", features = ["env", "toml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Errors / utils
thiserror = "2"
anyhow = "1"
dashmap = "6"
async-trait = "0.1"
once_cell = "1"
url = "2"
tokio-stream = "0.1"
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
