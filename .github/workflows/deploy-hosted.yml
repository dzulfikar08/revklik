# Deploys the hosted RevKlik (app.revklik.com) to Cloudflare on every push to main.
# Runs ONLY in the upstream repository: forks and self-hosters never deploy from here,
# they deploy with their own wrangler config (README: "Self-host on Cloudflare").
#
# Same steps as scripts/deploy-new-ui.sh, which this workflow calls: gates (typecheck, lint,
# worker + web tests), build apps/web, stage it with the tracker scripts, `wrangler deploy`.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   API token with Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id
# Worker secrets (POLAR_*, GOOGLE_*, ...) live in Cloudflare, set once with `wrangler secret put`.
name: Deploy hosted

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue instead of cancelling each other: a half-finished deploy is worse than a wait.
concurrency:
  group: deploy-hosted
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'dzulfikar08/revklik'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # keep in sync with "packageManager" in package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gates, build and deploy
        run: ./scripts/deploy-new-ui.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
