<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="theme-color" content="#1a1c24" />
		<title>revklik</title>
		<style>
			/* Pre-hydration paint: page colour for the stored or OS theme, so a slow
			   bundle never flashes white. Same values as the app's light and dark
			   background tokens. The mark below is replaced when React mounts. */
			html {
				background: #faf9f6;
				color-scheme: light dark;
			}
			@media (prefers-color-scheme: dark) {
				html {
					background: #0b0e14;
				}
			}
			html.light {
				background: #faf9f6;
			}
			html.dark {
				background: #0b0e14;
			}
			.rk-splash {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
			}
			.rk-splash svg {
				width: 64px;
				height: auto;
			}
		</style>
		<script>
			/* Language and theme before first paint, mirroring detectLocale() and the
			   next-themes storage key, so <html lang> and the page colour are right
			   while the bundle loads. */
			(function () {
				try {
					var root = document.documentElement;
					var lang = (location.search.match(/[?&]lang=(id|en)(?:&|$)/) || [])[1];
					try {
						lang = lang || localStorage.getItem("kp_locale");
					} catch (e) {}
					if (lang !== "id" && lang !== "en") {
						lang = /^id/i.test(navigator.language || "") ? "id" : "en";
					}
					root.lang = lang;
					var theme = null;
					try {
						theme = localStorage.getItem("vite-ui-theme");
					} catch (e) {}
					var dark =
						theme === "dark" ||
						(theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
					root.classList.add(dark ? "dark" : "light");
					root.style.colorScheme = dark ? "dark" : "light";
				} catch (e) {}
			})();
		</script>
	</head>

	<body>
		<div id="app">
			<div class="rk-splash" aria-hidden="true">
				<svg viewBox="0 0 283.57 214.25" focusable="false">
					<path
						fill="#F3B243"
						d="M0 174.21Q0 170.21 3.75 168.83L29.69 159.25Q32.5 158.21 32.5 161.21L32.5 207.21Q32.5 210.21 29.5 210.21L3 210.21Q0 210.21 0 207.21ZM45 146.71Q45 142.71 48.71 141.23L74.71 130.83Q77.5 129.71 77.5 132.71L77.5 207.21Q77.5 210.21 74.5 210.21L48 210.21Q45 210.21 45 207.21Z"
					/>
					<path
						fill="#F99D4E"
						d="M90 108.71Q90 104.21 94.03 102.22L135.36 81.77Q138.5 80.21 138.5 83.71L138.5 207.21Q138.5 210.21 135.5 210.21L93 210.21Q90 210.21 90 207.21ZM152.5 2.96Q152.5 -1.54 156.36 0.78L281.64 76.14Q285.5 78.46 281.63 80.77L238.5 106.46L280.98 179.26Q283 182.71 279.91 185.26L246.09 213.17Q243 215.71 241 212.25L195 132.71L159.49 161.54Q152.5 167.21 152.5 158.21Z"
					/>
				</svg>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
