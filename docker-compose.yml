services:
  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: revklik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revklik}
      POSTGRES_DB: revklik
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revklik -d revklik"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:15432:5432" # local debug only

  api:
    build:
      context: .
      dockerfile: server-rs/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      REV_DATABASE_URL: postgres://revklik:${POSTGRES_PASSWORD:-revklik}@db:5432/revklik
      REV_HOST: 0.0.0.0
      REV_PORT: "8787"
      REV_CORS_ORIGINS: ${REV_CORS_ORIGINS:-*}
      REV_STATIC_DIR: /app/static
      REV_ENABLE_JOBS: "true"
      REV_SUPER_ADMIN_EMAIL: seed@loadtest.local
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "8787:8787" # API + SPA on one origin

volumes:
  db_data:
