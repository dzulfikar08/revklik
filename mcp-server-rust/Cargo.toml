[package]
name = "revklik-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for RevKlik — AI agent access to analytics, sites, tokens, and GSC data"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
